<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本市区町村 インタラクティブ塗り絵マップ</title>
    
    <!-- PWA 用メタタグ & Manifest 読み込み -->
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="市区町村ペイント">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='100' fill='%234f46e5'/><path d='M150 150 h212 v212 h-212 z' fill='none' stroke='white' stroke-width='30'/><circle cx='256' cy='256' r='60' fill='%2338bdf8'/></svg>">
    <link rel="manifest" href="manifest.json">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- html2canvas (画像エクスポート用) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <!-- leaflet-image (Leaflet専用キャプチャライブラリ・位置ズレ防止) -->
    <script src="https://unpkg.com/leaflet-image@0.4.0/leaflet-image.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- 外部CSSファイル -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 text-slate-800 h-screen flex flex-col overflow-hidden">

    <!-- ヘッダー -->
    <header class="bg-slate-900 text-white px-4 py-3 shadow-md flex flex-wrap justify-between items-center z-20 gap-3">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 p-2 rounded-lg flex items-center justify-center shadow-lg">
                <i data-lucide="map" class="w-6 h-6 text-white"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold leading-tight">市区町村 塗り絵ペイント</h1>
                <p class="text-xs text-slate-400">国土数値情報 オープンデータ活用マップ</p>
            </div>
        </div>

        <!-- 都道府県選択 & アクションボタン -->
        <div class="flex flex-wrap items-center gap-2">
            <!-- 都道府県複数選択ボタン -->
            <button id="btnOpenPrefModal" class="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-white font-medium text-sm rounded-lg border border-slate-700 px-3 py-2 transition shadow-inner">
                <i data-lucide="map-pin" class="w-4 h-4 text-indigo-400"></i>
                <span id="selectedPrefLabel" class="truncate max-w-[150px] sm:max-w-[200px]">全国（日本全体）</span>
                <span id="selectedPrefBadge" class="bg-indigo-600 text-white text-[10px] px-1.5 py-0.5 rounded-full font-bold hidden">0</span>
                <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400"></i>
            </button>

            <div class="h-6 w-px bg-slate-700 hidden sm:block"></div>

            <!-- アクションボタン群 -->
            <button id="btnExportJson" class="flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-medium px-3 py-2 rounded-lg border border-slate-700 transition shadow-sm" title="現在の塗り状態を保存">
                <i data-lucide="download" class="w-4 h-4 text-indigo-400"></i>
                <span class="hidden md:inline">保存 (JSON)</span>
            </button>
            
            <label class="flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-medium px-3 py-2 rounded-lg border border-slate-700 transition cursor-pointer shadow-sm" title="保存したJSONを復元">
                <i data-lucide="upload" class="w-4 h-4 text-emerald-400"></i>
                <span class="hidden md:inline">復元</span>
                <input type="file" id="btnImportJson" accept=".json" class="hidden">
            </label>

            <button id="btnExportPng" class="flex items-center gap-1.5 bg-indigo-600 hover:bg-indigo-500 text-xs font-semibold px-3 py-2 rounded-lg transition shadow-md" title="地図を画像として保存">
                <i data-lucide="image" class="w-4 h-4"></i>
                <span class="hidden sm:inline">PNG保存</span>
            </button>

            <button id="btnExportSvg" class="flex items-center gap-1.5 bg-emerald-600 hover:bg-emerald-500 text-xs font-semibold px-3 py-2 rounded-lg transition shadow-md" title="ベクター地図(SVG)として保存">
                <i data-lucide="file-code" class="w-4 h-4"></i>
                <span>SVG保存</span>
            </button>

            <!-- PWA インストールボタン (インストール可能時に表示) -->
            <button id="btnInstallPwa" class="hidden flex items-center gap-1.5 bg-amber-500 hover:bg-amber-400 text-slate-900 text-xs font-bold px-3 py-2 rounded-lg transition shadow-md" title="アプリとしてホーム画面に追加/インストール">
                <i data-lucide="download-cloud" class="w-4 h-4"></i>
                <span>アプリインストール</span>
            </button>
        </div>
    </header>

    <!-- メインコンテンツ領域（サイドバー + マップ） -->
    <div class="flex-1 flex flex-col md:flex-row overflow-hidden relative">

        <!-- 左サイドパネル (コントロール & 情報) -->
        <aside class="w-full md:w-80 lg:w-96 bg-white border-r border-slate-200 flex flex-col z-10 shadow-lg shrink-0 max-h-[45vh] md:max-h-full overflow-y-auto">
            
            <!-- 塗りつぶし進捗状況カード -->
            <div class="p-4 border-b border-slate-100 bg-slate-50">
                <div class="flex justify-between items-center mb-1.5">
                    <span id="currentPrefName" class="font-bold text-slate-800 text-base">全国（日本全体）</span>
                    <span id="progressPercent" class="text-xs font-bold bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full">0%</span>
                </div>
                <!-- プログレスバー -->
                <div class="w-full bg-slate-200 rounded-full h-2.5 overflow-hidden mb-2 shadow-inner">
                    <div id="progressBar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
                <div class="flex justify-between text-xs text-slate-500">
                    <span>塗りつぶし完了:</span>
                    <span class="font-medium text-slate-700"><strong id="coloredCount" class="text-indigo-600 font-bold">0</strong> / <span id="totalCount">0</span> 市区町村</span>
                </div>
            </div>

            <!-- ツールボックス & カラーパレット -->
            <div class="p-4 border-b border-slate-100 space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">モード選択</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button id="btnPaintMode" class="flex items-center justify-center gap-2 py-2 px-3 text-xs font-semibold rounded-lg border border-indigo-600 bg-indigo-50 text-indigo-700 transition shadow-sm">
                            <i data-lucide="paint-bucket" class="w-4 h-4"></i>
                            塗りつぶし
                        </button>
                        <button id="btnEraserMode" class="flex items-center justify-center gap-2 py-2 px-3 text-xs font-semibold rounded-lg border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 transition">
                            <i data-lucide="eraser" class="w-4 h-4"></i>
                            消しゴム
                        </button>
                    </div>
                </div>

                <!-- カラーパレット -->
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">カラーパレット</label>
                        <!-- カスタムカラー選択 -->
                        <div class="flex items-center gap-1.5">
                            <span class="text-xs text-slate-400">カスタム:</span>
                            <input type="color" id="customColorPicker" value="#3b82f6" class="w-6 h-6 rounded-full cursor-pointer border border-slate-300 shadow-sm">
                        </div>
                    </div>
                    <!-- プリセットカラー -->
                    <div id="colorPalette" class="grid grid-cols-6 gap-2">
                        <!-- JSでパレットボタン生成 -->
                    </div>
                </div>

                <!-- 一括操作ボタン -->
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">一括操作</label>
                    <div class="flex gap-2">
                        <button id="btnFillAll" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium py-1.5 px-2 rounded-md transition flex items-center justify-center gap-1">
                            <i data-lucide="maximize" class="w-3.5 h-3.5"></i>
                            全塗る
                        </button>
                        <button id="btnClearAll" class="flex-1 bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-medium py-1.5 px-2 rounded-md transition flex items-center justify-center gap-1">
                            <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                            クリア
                        </button>
                    </div>
                </div>
            </div>

            <!-- 地図背景（タイル）切替 -->
            <div class="p-4 border-b border-slate-100">
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">背景地図スタイル</label>
                <div class="grid grid-cols-3 gap-1.5 bg-slate-100 p-1 rounded-lg mb-3">
                    <button data-tile="pale" class="tile-btn active bg-white text-indigo-600 shadow-sm text-xs font-medium py-1 px-2 rounded-md transition text-center">地理院(淡色)</button>
                    <button data-tile="std" class="tile-btn text-slate-600 hover:text-slate-900 text-xs font-medium py-1 px-2 rounded-md transition text-center">地理院(標準)</button>
                    <button data-tile="none" class="tile-btn text-slate-600 hover:text-slate-900 text-xs font-medium py-1 px-2 rounded-md transition text-center">白地図(なし)</button>
                </div>
                
                <div class="flex items-center justify-between text-xs">
                    <span class="text-slate-600 font-medium">背景色 (海洋/余白):</span>
                    <input type="color" id="bgColorPicker" value="#f1f5f9" class="w-6 h-6 rounded-md cursor-pointer border border-slate-300 shadow-sm">
                </div>
            </div>

            <!-- 境界線カスタマイズ設定 -->
            <div class="p-4 border-b border-slate-100 space-y-3">
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider">境界線表示カスタマイズ</label>

                <!-- 海岸線設定 -->
                <div class="p-2.5 bg-slate-50 rounded-xl border border-slate-200 text-xs space-y-2">
                    <div class="flex items-center justify-between">
                        <label class="flex items-center gap-1.5 font-bold text-slate-700 cursor-pointer select-none">
                            <input type="checkbox" id="chkCoastBoundary" checked class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 w-3.5 h-3.5">
                            <span>海岸線</span>
                        </label>
                        <input type="color" id="colorCoastBoundary" value="#1e293b" class="w-5 h-5 rounded cursor-pointer border border-slate-300">
                    </div>
                    <div class="grid grid-cols-2 gap-2 text-[11px]">
                        <div class="flex items-center gap-1">
                            <span class="text-slate-500">太さ:</span>
                            <select id="weightCoastBoundary" class="bg-white border border-slate-200 rounded px-1 py-0.5 w-full text-slate-700">
                                <option value="0.5">0.5px</option>
                                <option value="1">1px</option>
                                <option value="1.5">1.5px</option>
                                <option value="2" selected>2px</option>
                                <option value="2.5">2.5px</option>
                                <option value="3">3px</option>
                                <option value="3.5">3.5px</option>
                                <option value="4">4px</option>
                                <option value="4.5">4.5px</option>
                                <option value="5">5px</option>
                            </select>
                        </div>
                        <div class="flex items-center gap-1">
                            <span class="text-slate-500">線種:</span>
                            <select id="styleCoastBoundary" class="bg-white border border-slate-200 rounded px-1 py-0.5 w-full text-slate-700">
                                <option value="solid" selected>実線</option>
                                <option value="dashed">破線</option>
                                <option value="dotted">点線</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- 県境設定 -->
                <div class="p-2.5 bg-slate-50 rounded-xl border border-slate-200 text-xs space-y-2">
                    <div class="flex items-center justify-between">
                        <label class="flex items-center gap-1.5 font-bold text-slate-700 cursor-pointer select-none">
                            <input type="checkbox" id="chkPrefBoundary" checked class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 w-3.5 h-3.5">
                            <span>都道府県境</span>
                        </label>
                        <input type="color" id="colorPrefBoundary" value="#0f172a" class="w-5 h-5 rounded cursor-pointer border border-slate-300">
                    </div>
                    <div class="grid grid-cols-2 gap-2 text-[11px]">
                        <div class="flex items-center gap-1">
                            <span class="text-slate-500">太さ:</span>
                            <select id="weightPrefBoundary" class="bg-white border border-slate-200 rounded px-1 py-0.5 w-full text-slate-700">
                                <option value="0.5">0.5px</option>
                                <option value="1">1px</option>
                                <option value="1.5">1.5px</option>
                                <option value="2">2px</option>
                                <option value="2.5" selected>2.5px</option>
                                <option value="3">3px</option>
                                <option value="3.5">3.5px</option>
                                <option value="4">4px</option>
                                <option value="4.5">4.5px</option>
                                <option value="5">5px</option>
                            </select>
                        </div>
                        <div class="flex items-center gap-1">
                            <span class="text-slate-500">線種:</span>
                            <select id="stylePrefBoundary" class="bg-white border border-slate-200 rounded px-1 py-0.5 w-full text-slate-700">
                                <option value="solid" selected>実線</option>
                                <option value="dashed">破線</option>
                                <option value="dotted">点線</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- 市町村境設定 -->
                <div class="p-2.5 bg-slate-50 rounded-xl border border-slate-200 text-xs space-y-2">
                    <div class="flex items-center justify-between">
                        <label class="flex items-center gap-1.5 font-bold text-slate-700 cursor-pointer select-none">
                            <input type="checkbox" id="chkCityBoundary" checked class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 w-3.5 h-3.5">
                            <span>市区町村境</span>
                        </label>
                        <input type="color" id="colorCityBoundary" value="#475569" class="w-5 h-5 rounded cursor-pointer border border-slate-300">
                    </div>
                    <div class="grid grid-cols-2 gap-2 text-[11px]">
                        <div class="flex items-center gap-1">
                            <span class="text-slate-500">太さ:</span>
                            <select id="weightCityBoundary" class="bg-white border border-slate-200 rounded px-1 py-0.5 w-full text-slate-700">
                                <option value="0.5">0.5px</option>
                                <option value="1" selected>1px</option>
                                <option value="1.5">1.5px</option>
                                <option value="2">2px</option>
                                <option value="2.5">2.5px</option>
                                <option value="3">3px</option>
                                <option value="3.5">3.5px</option>
                                <option value="4">4px</option>
                                <option value="4.5">4.5px</option>
                                <option value="5">5px</option>
                            </select>
                        </div>
                        <div class="flex items-center gap-1">
                            <span class="text-slate-500">線種:</span>
                            <select id="styleCityBoundary" class="bg-white border border-slate-200 rounded px-1 py-0.5 w-full text-slate-700">
                                <option value="solid" selected>実線</option>
                                <option value="dashed">破線</option>
                                <option value="dotted">点線</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- 政令市行政区境設定 -->
                <div class="p-2.5 bg-slate-50 rounded-xl border border-slate-200 text-xs space-y-2">
                    <div class="flex items-center justify-between">
                        <label class="flex items-center gap-1.5 font-bold text-slate-700 cursor-pointer select-none">
                            <input type="checkbox" id="chkWardBoundary" checked class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 w-3.5 h-3.5">
                            <span>政令市 行政区境</span>
                        </label>
                        <input type="color" id="colorWardBoundary" value="#64748b" class="w-5 h-5 rounded cursor-pointer border border-slate-300">
                    </div>
                    <div class="grid grid-cols-2 gap-2 text-[11px]">
                        <div class="flex items-center gap-1">
                            <span class="text-slate-500">太さ:</span>
                            <select id="weightWardBoundary" class="bg-white border border-slate-200 rounded px-1 py-0.5 w-full text-slate-700">
                                <option value="0.5">0.5px</option>
                                <option value="1" selected>1px</option>
                                <option value="1.5">1.5px</option>
                                <option value="2">2px</option>
                                <option value="2.5">2.5px</option>
                                <option value="3">3px</option>
                                <option value="3.5">3.5px</option>
                                <option value="4">4px</option>
                                <option value="4.5">4.5px</option>
                                <option value="5">5px</option>
                            </select>
                        </div>
                        <div class="flex items-center gap-1">
                            <span class="text-slate-500">線種:</span>
                            <select id="styleWardBoundary" class="bg-white border border-slate-200 rounded px-1 py-0.5 w-full text-slate-700">
                                <option value="solid">実線</option>
                                <option value="dashed" selected>破線</option>
                                <option value="dotted">点線</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 塗りつぶし済みリスト（色別タブ/リスト） -->
            <div class="flex-1 p-4 flex flex-col min-h-[160px]">
                <div class="flex justify-between items-center mb-2">
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">塗った市区町村リスト</label>
                    <span id="coloredBadge" class="text-[10px] bg-slate-100 text-slate-600 font-bold px-1.5 py-0.5 rounded">0件</span>
                </div>
                <div id="coloredCityList" class="flex-1 overflow-y-auto space-y-1.5 pr-1 text-xs">
                    <div class="text-slate-400 text-center py-6 text-xs">まだ塗りつぶされた市区町村はありません</div>
                </div>
            </div>

            <!-- クレジット -->
            <div class="p-3 bg-slate-50 border-t border-slate-200 text-[11px] text-slate-400 text-center">
                出典: 国土交通省「国土数値情報（行政区域データ）」<br>
                データ加工: smartnews-smri/japan-topography
            </div>
        </aside>

        <!-- メインマップ表示エリア -->
        <main class="flex-1 relative bg-slate-200">
            <!-- Leaflet マップコンテナ -->
            <div id="map" class="w-full h-full z-0"></div>

            <!-- ローディングオーバーレイ -->
            <div id="loadingOverlay" class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm flex flex-col justify-center items-center z-30 transition-opacity duration-300 hidden">
                <div class="bg-white p-5 rounded-2xl shadow-2xl flex flex-col items-center gap-3 max-w-xs text-center">
                    <div class="w-10 h-10 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
                    <div>
                        <h3 class="font-bold text-slate-800 text-sm mb-0.5">データを取得中...</h3>
                        <p id="loadingText" class="text-xs text-slate-500">GeoJSON境界データを読み込んでいます</p>
                    </div>
                </div>
            </div>

            <!-- マウスホバー情報（右上のフローティングカード） -->
            <div id="hoverCard" class="absolute top-4 right-4 bg-white/95 backdrop-blur-md px-4 py-2.5 rounded-xl shadow-lg border border-slate-100 z-10 pointer-events-none transition-all duration-200 min-w-[180px] hidden">
                <div class="text-[10px] font-bold text-indigo-600 tracking-wider uppercase mb-0.5" id="hoverPref">東京都</div>
                <div class="text-sm font-bold text-slate-800" id="hoverCity">新宿区</div>
                <div class="text-[11px] text-slate-400 mt-0.5 flex justify-between gap-3">
                    <span>行政コード:</span>
                    <span id="hoverCode" class="font-mono text-slate-600">13104</span>
                </div>
            </div>

            <!-- マップコントロール（再フィットボタン等） -->
            <div class="absolute bottom-6 right-4 z-10 flex flex-col gap-2">
                <button id="btnResetView" class="bg-white hover:bg-slate-50 text-slate-700 p-2.5 rounded-xl shadow-md border border-slate-200 transition flex items-center justify-center" title="全体を表示">
                    <i data-lucide="scan" class="w-5 h-5"></i>
                </button>
            </div>
        </main>
    </div>

    <!-- トースト通知コンテナ -->
    <div id="toastContainer" class="fixed bottom-4 left-1/2 transform -translate-x-1/2 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- 都道府県複数選択モーダル -->
    <div id="prefModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex justify-center items-center z-50 p-4 hidden">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden border border-slate-100">
            <!-- モーダルヘッダー -->
            <div class="px-5 py-4 bg-slate-900 text-white flex justify-between items-center shrink-0">
                <div class="flex items-center gap-2">
                    <i data-lucide="map-pin" class="w-5 h-5 text-indigo-400"></i>
                    <h3 class="font-bold text-base">表示する都道府県を選択 (複数選択可)</h3>
                </div>
                <button id="btnClosePrefModal" class="text-slate-400 hover:text-white p-1 rounded-lg transition">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- モーダルボディ -->
            <div class="p-5 overflow-y-auto flex-1 space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">地方で一括選択</label>
                    <div class="flex flex-wrap gap-1.5" id="regionButtons">
                        <button type="button" class="region-btn text-xs px-2.5 py-1.5 rounded-lg bg-indigo-50 text-indigo-700 font-bold border border-indigo-200 hover:bg-indigo-100 transition" data-region="ALL">全国 (全選択)</button>
                        <button type="button" class="region-btn text-xs px-2.5 py-1.5 rounded-lg bg-slate-100 text-slate-700 font-medium border border-slate-200 hover:bg-slate-200 transition" data-region="CLEAR">選択解除</button>
                        <span class="w-px h-6 bg-slate-200 self-center"></span>
                        <button type="button" class="region-btn text-xs px-2.5 py-1.5 rounded-lg bg-slate-100 text-slate-700 font-medium hover:bg-slate-200 transition" data-region="hokkaido-tohoku">北海道・東北</button>
                        <button type="button" class="region-btn text-xs px-2.5 py-1.5 rounded-lg bg-slate-100 text-slate-700 font-medium hover:bg-slate-200 transition" data-region="kanto">関東</button>
                        <button type="button" class="region-btn text-xs px-2.5 py-1.5 rounded-lg bg-slate-100 text-slate-700 font-medium hover:bg-slate-200 transition" data-region="chubu">中部</button>
                        <button type="button" class="region-btn text-xs px-2.5 py-1.5 rounded-lg bg-slate-100 text-slate-700 font-medium hover:bg-slate-200 transition" data-region="kinki">近畿</button>
                        <button type="button" class="region-btn text-xs px-2.5 py-1.5 rounded-lg bg-slate-100 text-slate-700 font-medium hover:bg-slate-200 transition" data-region="chugoku-shikoku">中国・四国</button>
                        <button type="button" class="region-btn text-xs px-2.5 py-1.5 rounded-lg bg-slate-100 text-slate-700 font-medium hover:bg-slate-200 transition" data-region="kyushu-okinawa">九州・沖縄</button>
                    </div>
                </div>

                <hr class="border-slate-100">

                <div id="prefCheckboxGrid" class="space-y-4">
                    <!-- JSで地域ごとに動的生成 -->
                </div>

                <hr class="border-slate-100">

                <!-- 島嶼部（離島）表示設定 -->
                <div class="p-3.5 bg-slate-50 rounded-xl border border-slate-200">
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                        <i data-lucide="anchor" class="w-4 h-4 text-indigo-500"></i>
                        島嶼部（離島）の表示設定
                    </label>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 text-xs">
                        <label class="flex items-center justify-between p-2 bg-white rounded-lg border border-slate-200 cursor-pointer hover:bg-indigo-50/50 transition select-none">
                            <span class="text-slate-700 font-medium">東京都（伊豆・小笠原）</span>
                            <input type="checkbox" id="modalToggleIsland13" class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 w-4 h-4">
                        </label>
                        <label class="flex items-center justify-between p-2 bg-white rounded-lg border border-slate-200 cursor-pointer hover:bg-indigo-50/50 transition select-none">
                            <span class="text-slate-700 font-medium">鹿児島県（奄美・トカラ等）</span>
                            <input type="checkbox" id="modalToggleIsland46" class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 w-4 h-4">
                        </label>
                        <label class="flex items-center justify-between p-2 bg-white rounded-lg border border-slate-200 cursor-pointer hover:bg-indigo-50/50 transition select-none">
                            <span class="text-slate-700 font-medium">沖縄県（宮古・八重山等）</span>
                            <input type="checkbox" id="modalToggleIsland47" class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 w-4 h-4">
                        </label>
                    </div>
                </div>
            </div>

            <!-- モーダルフッター -->
            <div class="px-5 py-3 bg-slate-50 border-t border-slate-200 flex justify-between items-center shrink-0">
                <div class="text-xs text-slate-500 font-medium">
                    選択中: <span id="modalSelectedCount" class="font-bold text-indigo-600">全国</span>
                </div>
                <div class="flex gap-2">
                    <button id="btnCancelPrefModal" type="button" class="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-200 rounded-lg transition">キャンセル</button>
                    <button id="btnApplyPrefModal" type="button" class="px-5 py-2 text-xs font-bold bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg transition shadow-md flex items-center gap-1.5">
                        <i data-lucide="check" class="w-4 h-4"></i>
                        決定して表示
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 外部JavaScriptファイル -->
    <script src="script.js"></script>
</body>
</html>
